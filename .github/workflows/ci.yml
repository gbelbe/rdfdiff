name: checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  # Text-only check on commit messages — no deps to install, no build. Only
  # meaningful against a PR's base branch.
  tidy:
    name: Tidy First ratchet
    runs-on: ubuntu-latest
    # Skips bot-authored PRs (dependabot, etc.) — see complexity job's comment.
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need the base branch and full commit history

      - name: "Tidy First ratchet: a tidy(<type>) commit or Tidy-Exempt trailer"
        run: bash scripts/check_tidy_ratchet.sh --base "origin/${{ github.base_ref }}"

  # Mechanical companion to the ratchet above: for the 8 catalog heuristics
  # craftCov can detect (scripts/craftcov.py --list-detectors), a touched
  # .py file's total across them must go down (or stay at 0) vs. where the
  # branch diverged from main. See CRAFTSMANSHIP.md's "Refactor First".
  refactor-first:
    name: Refactor First gate
    runs-on: ubuntu-latest
    # Skips bot-authored PRs (dependabot, etc.) — see complexity job's comment.
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: "Refactor First: touched files' detectable-heuristic total must go down (or stay 0)"
        run: uv run python3 scripts/check_refactor_first.py --base "origin/${{ github.base_ref }}"

  # Independent of craftCov — own script, own catalog entries (CG032-
  # CG035), own toolchain (radon, cognitive-complexity).
  complexity:
    name: Complexity ratchet
    runs-on: ubuntu-latest
    # Skips bot-authored PRs (dependabot, etc.): can't write a Tidy-Exempt:
    # trailer, and a dependency bump has no complexity to fix.
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra complexity
        run: uv sync --extra complexity

      - name: "Complexity ratchet: cyclomatic/cognitive complexity, invariant return, duplicated literal"
        run: uv run python3 scripts/check_complexity_ratchet.py --base "origin/${{ github.base_ref }}"

  # Mutation ratchet runs on pull requests plus scheduled/manual fresh campaigns.
  mutation-ratchet:
    name: Mutation ratchet
    runs-on: ubuntu-latest
    if: (github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    env:
      CRAFT_GATE_TIMINGS: gate-timings.jsonl   # scripts/gate_timing.py appends each stage's duration here
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Is the mutation ratchet on for this repo?
        id: gate
        run: python3 scripts/gate_config.py mutation

      - name: uv sync --extra mutation --extra dev
        if: steps.gate.outputs.status == 'run'
        run: uv sync --extra mutation --extra dev

      - name: Cache mutmut results
        if: steps.gate.outputs.status == 'run'
        uses: actions/cache@v4
        with:
          path: mutants
          key: mutmut-${{ runner.os }}-${{ hashFiles('**/*.py', 'pyproject.toml', 'uv.lock') }}
          restore-keys: mutmut-${{ runner.os }}-

      - name: Force fresh mutation campaign on scheduled/manual runs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: rm -rf mutants

      # A full campaign on first initialisation and on the few cache-wide causes (a lock file, the dependency
      # list, pytest's arguments, the root conftest); otherwise only what the diff can have changed.
      - name: mutmut run (diff-scoped)
        if: steps.gate.outputs.status == 'run'
        run: uv run python3 scripts/mutation_plan.py run --base "origin/${{ github.base_ref || 'main' }}"

      - name: "Mutation ratchet: touched functions' mutation score"
        if: steps.gate.outputs.status == 'run'
        run: >
          uv run python3 scripts/check_mutation_ratchet.py
          --base "origin/${{ github.base_ref || 'main' }}"
          --threshold ${{ steps.gate.outputs.threshold }}
          --improvement ${{ steps.gate.outputs.improvement }}

      # Where the time went: the planner's stages, then the tests that make every mutant slow.
      - name: Where the mutation time went
        if: always() && steps.gate.outputs.status == 'run'
        run: |
          { python3 scripts/gate_timing.py report "$CRAFT_GATE_TIMINGS"
            echo
            python3 scripts/gate_timing.py mutants; } >> "$GITHUB_STEP_SUMMARY"

  # Runs only the scenarios and applies diff-cover to that report: every line the diff changed must be
  # exercised by a scenario, not only by a unit test. On unless declared off in pyproject.toml's
  # [tool.craft-gate.bdd] (see CRAFTSMANSHIP.md, "Test gates").
  behaviour-coverage:
    name: Behaviour coverage (Gherkin)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && !endsWith(github.actor, '[bot]')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: Is this gate on for this repo?
        id: gate
        run: python3 scripts/gate_config.py bdd

      - name: uv sync --extra dev
        if: steps.gate.outputs.status == 'run'
        run: uv sync --extra dev

      - name: Run the behaviour tests with coverage
        if: steps.gate.outputs.status == 'run'
        run: uv run pytest ${{ steps.gate.outputs.paths }} --cov --cov-report=xml:coverage-bdd.xml

      - name: "Behaviour coverage: changed lines must be covered by scenarios"
        if: steps.gate.outputs.status == 'run'
        run: |
          set -f   # the exclude globs are for diff-cover, not for this shell
          uv run diff-cover coverage-bdd.xml \
            --compare-branch "origin/${{ github.base_ref }}" \
            --fail-under ${{ steps.gate.outputs.threshold }} \
            ${{ steps.gate.outputs.exclude && format('--exclude {0}', steps.gate.outputs.exclude) || '' }}

  # Reporting, not a gate — see DESIGN.md's Reporting section.
  craftcov-pr-comment:
    name: craftCov PR report
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Post/update the craftCov PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python3 scripts/craftcov_pr_comment.py \
            --base "origin/${{ github.base_ref }}" \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

  # Optional reporting, not a gate. Public repo, so code scanning is
  # available with no extra licensing.
  craftcov-sarif:
    name: Upload craftCov SARIF
    runs-on: ubuntu-latest
    # This repo's own `push:` trigger isn't branch-scoped (unlike
    # pull_request, which the other jobs already guard against) — restrict
    # explicitly to main so this doesn't fire on every feature-branch push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: uv sync --extra craftcov
        run: uv sync --extra craftcov

      - name: Generate craftCov SARIF
        run: uv run python3 scripts/craftcov.py --format sarif --no-cache --no-diff > craftcov.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: craftcov.sarif
          category: craftcov

  checks:
    name: Static checks (prek)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --extra dev
      - name: prek — lint, format, types, security, hygiene
        run: SKIP=complexity-ratchet uvx prek run --all-files

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install deps
        run: uv sync --extra dev
      - name: pip-audit — dependency CVEs
        run: uv run pip-audit --skip-editable

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scripts/ci.sh needs origin/main for tidy-ratchet + patch-coverage
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash scripts/ci.sh ${{ matrix.python }}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdfdiff"
version = "0.1.1"
description = "Read an RDF file's Git history as semantic change rather than text"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["rdf", "ontology", "semantic-web", "git", "diff", "skos", "owl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "rdflib>=7.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "pytest-describe>=2.2",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
semanticdiff = "semanticdiff.cli:main"

[project.urls]
Homepage = "https://github.com/gbelbe/rdfdiff"
Repository = "https://github.com/gbelbe/rdfdiff"
Issues = "https://github.com/gbelbe/rdfdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["semanticdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers --strict-config"

[tool.coverage.run]
source_pkgs = ["semanticdiff"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Keep str + Enum for the established serialized public API.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true

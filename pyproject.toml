[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rdfdiff"
version = "0.1.1"
description = "Read an RDF file's Git history as semantic change rather than text"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["rdf", "ontology", "semantic-web", "git", "diff", "skos", "owl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
]
dependencies = [
    "rdflib>=7.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-bdd>=7.0",
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
    "mutmut>=3.8",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    # scripts/check_complexity_ratchet.py's engine: radon for cyclomatic,
    # cognitive-complexity for the metric SonarQube gates on (S3776).
    "radon>=6.0",
    "cognitive-complexity>=1.3",
    # Patch-coverage gate: changed lines must be ≥ 90% covered (scripts/ci.sh).
    "diff-cover>=9.0",
]
# craft-gate's craftCov scan (scripts/craftcov.py) and the Refactor First CI
# gate built on it (scripts/check_refactor_first.py) — see CRAFTSMANSHIP.md.
# ruff is already in `dev`, listed again here so `uv sync --extra craftcov`
# alone is enough to run either script, without also pulling in `dev`.
craftcov = [
    "pyyaml>=6.0",
    "ruff>=0.13",
    "pylint>=3.3",
    "vulture>=2.14",
]
# craft-gate's complexity ratchet (scripts/check_complexity_ratchet.py) —
# see CRAFTSMANSHIP.md's "The complexity ratchet".
complexity = [
    "radon>=6.0",
    "cognitive-complexity>=1.3",
]
mutation = [
    "mutmut>=3.8",
]

[tool.mutmut]
source_paths = ["semanticdiff"]
cache_invalidation_files = ["tests/**/*.py", "conftest.py"]
on_dependency_change = "rerun"

[project.scripts]
semanticdiff = "semanticdiff.cli:main"

[project.urls]
Homepage = "https://github.com/gbelbe/rdfdiff"
Repository = "https://github.com/gbelbe/rdfdiff"
Issues = "https://github.com/gbelbe/rdfdiff/issues"

[tool.hatch.build.targets.wheel]
packages = ["semanticdiff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --strict-markers --strict-config"

[tool.coverage.run]
source_pkgs = ["semanticdiff"]
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "if TYPE_CHECKING:",
    "if __name__ == [\"']__main__[\"']:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = [
    # Keep str + Enum for the established serialized public API.
    "UP042",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
pretty = true
